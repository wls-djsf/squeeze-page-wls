<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeeze Page WLS</title>

    <!-- Link o CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="caixa-mae">
    <div class="caixa-central">
        <!-- Elemento de mídia centralizado para identidade visual -->
        <img class="imagem-destaque" src="image.png" alt="Logotipo ilustrativo da squeeze page">


        <h1 class="titulo">Destaque Principal da Sua Oferta ou Produto</h1>
        <p class="subtitulo">Insira uma breve descrição de até duas linhas para apresentar o benefício e capturar o contato do visitante.
</p>

        <form class="formulario" action="">
            <input type="email" placeholder="Digite seu e-mail" required class="input-email">
            <button type="submit" class="botao-enviar">Acessar Agora</button>
        </form>
    </div>
</main>
</body>
</html>
